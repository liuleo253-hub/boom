<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>5s压榨工作台</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <link rel="stylesheet" href="style.css?v=20260528-local-manager-2">
</head>
<body>
<div id="bgLayer"></div>
<div id="bgOverlay"></div>
<button class="manage-btn" id="manageBtn" type="button">管理</button>
<div class="container">
  <!-- 头部 -->
  <div class="header-area">
    <h1>5s压榨工作台</h1>
  </div>
  <!-- 搜索区域 -->
  <div class="search-wrapper">
    <!-- 搜索框 -->
    <div class="search-box">
      <button class="engine-trigger" id="engineTrigger" aria-label="切换搜索引擎">
        <img id="search-engine-icon" src="" alt="搜索引擎图标">
        <span class="engine-name" id="engineName"></span>
        <span class="engine-arrow" id="engineArrow">▾</span>
      </button>
      <div class="search-divider"></div>
      <input type="text" id="searchInput" placeholder="搜索网页 / 定位工作台工具" autocomplete="off" oninput="filterLinks()" />
      <button class="clear-btn" id="clearBtn" aria-label="清空" style="display:none;" onclick="clearSearch()">✕</button>
      <button class="search-submit-btn" onclick="doSearch()" aria-label="搜索">
  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="8"/>
    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
  </svg>
</button>
    </div>
  </div>

  <!-- 链接分区（由 main.js 动态渲染） -->
  <div id="main-content"></div>
</div>
<div class="manage-modal" id="manageModal" hidden>
  <div class="manage-panel">
    <div class="manage-header">
      <h2>本地管理</h2>
      <button class="modal-close-btn" id="closeManageBtn" type="button" aria-label="关闭">×</button>
    </div>
    <form class="manage-form" id="siteForm">
      <label>
        名称
        <input id="siteTitle" type="text" autocomplete="off" required>
      </label>
      <label>
        网址
        <input id="siteUrl" type="url" autocomplete="off" placeholder="https://example.com" required>
      </label>
      <label>
        分类
        <select id="siteSection">
          <option value="常用">常用</option>
          <option value="视频">视频</option>
          <option value="图片">图片</option>
          <option value="语音">语音</option>
          <option value="其他">其他</option>
        </select>
      </label>
      <label>
        描述
        <input id="siteDesc" type="text" autocomplete="off" placeholder="可不填">
      </label>
      <button class="form-submit-btn" type="submit">新增网站</button>
    </form>
    <div class="custom-sites" id="customSites"></div>
  </div>
</div>
<script src="main.js?v=20260528-local-manager-2"></script>
</body>
</html>
